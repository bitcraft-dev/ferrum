[package]
name = "ferrum"
version = "0.1.0"
edition = "2024"
description = "Ferrum embedded DSL compiler — Rust codegen for .fe source files"
license     = "Apache-2.0 OR GPL-3.0-or-later"
license-file     = "../LICENSE"

[[bin]]
name = "ferrum"
path = "src/main.rs"

[dependencies]
# The core compiler pipeline (lexer, parser, semantic pass, codegen)
# is pure Rust with no dependencies. These four are used only by the
# `ferrum lsp --stdio` subcommand (compiler/src/lsp/) — implementing
# JSON-RPC framing and the LSP type system by hand wasn't worth the
# correctness risk versus using the same crates rust-analyzer does.
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
lsp-types   = "0.95"
lsp-server  = "0.7"

[dev-dependencies]
# No additional test dependencies beyond std.
